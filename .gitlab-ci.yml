image: mcr.microsoft.com/dotnet/sdk:10.0

variables:
  # Optimize NuGet performance
  NUGET_PACKAGES_DIR: ".nuget"
  OBJECTS_DIR: "**/obj/**"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

stages:
  - lint
  - test
  - analyze
  - security

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .nuget/
    - "**/obj/"
    - "${SONAR_USER_HOME}/cache"
    - sonar-scanner/

linting_job:
  stage: lint
  script:
    - dotnet format --verify-no-changes
  allow_failure: false

unit_testing_job:
  stage: test
  script:
    - "echo 'TODO: Execute Unit Test'"

sonarqube_analyzing_job:
  stage: analyze
  script: 
      - "dotnet tool install --global dotnet-sonarscanner"
      - "export PATH=\"$PATH:$HOME/.dotnet/tools\""
      - "dotnet sonarscanner begin /k:\"$SONAR_PROJECT_KEY\" /d:sonar.token=\"$SONAR_TOKEN\" /d:\"sonar.host.url=$SONAR_HOST_URL\" "
      - "dotnet build"
      - "dotnet sonarscanner end /d:sonar.token=\"$SONAR_TOKEN\""
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'

dependency_vulnerability_checking_job:
  stage: security
  script:
    - dotnet list package --vulnerable --include-transitive
  allow_failure: true
